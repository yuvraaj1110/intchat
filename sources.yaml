# Knowledge sources for the international student chatbot.
# Add entries here, then run: python3 -m app.build_kb --reset
#
# Fields:
#   name     – human-readable label (shown in citations)
#   type     – "html" or "pdf"
#   url      – full URL (required for html)
#   path     – local path relative to project root (required for pdf)
#   category – maps to the chatbot's topic categories

